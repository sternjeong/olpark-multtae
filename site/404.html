<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물이 닿지 않는 곳이에요 · 올팍 물때</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B6676'/%3E%3C/svg%3E">
<style>
:root{--bg:#F6F8FA;--text:#0B2239;--muted:#4A5B6C;--primary:#0B6676}
@media (prefers-color-scheme: dark){:root{--bg:#0B1622;--text:#E8EEF4;--muted:#A7B6C4;--primary:#5CC6D6}}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;line-height:1.6;word-break:keep-all}
main{max-width:720px;margin:0 auto;padding:64px 16px;text-align:center}
p{color:var(--muted)} a{color:var(--primary);font-weight:700}
</style>
</head>
<body>
<main>
<h1 id="t">물이 닿지 않는 곳이에요</h1>
<p id="b">찾는 화면이 없어요. 주소를 확인해 주세요.</p>
<p><a id="home" href="./#/">오늘의 물때로 가기</a></p>
<p lang="en" id="en-note">Page not found. <a href="./#/" id="home-en">Go to Olpark Tides</a></p>
</main>
<script>
// GitHub Pages 하위 경로(/olpark-multtae/)에서 깊은 경로로 들어와도 서비스 루트로 돌아가게 한다.
var seg = location.pathname.split('/').filter(Boolean);
var base = location.hostname.slice(-10) === 'github.io' && seg.length ? ['', seg[0], ''].join('/') : './';
document.getElementById('home').setAttribute('href', base + '#/');
document.getElementById('home-en').setAttribute('href', base + '#/');
try {
  if (localStorage.getItem('olpark.lang') === 'en') {
    document.documentElement.lang = 'en';
    document.title = 'Page not found · Olpark Tides';
    document.getElementById('t').textContent = "The tide doesn't reach here";
    document.getElementById('b').textContent = "This page doesn't exist. Please check the address.";
    document.getElementById('home').textContent = "Go to today's tides";
    document.getElementById('en-note').hidden = true;
  }
} catch (e) {}
setTimeout(function () { location.replace(base + '#/'); }, 1000);
</script>
</body>
</html>
